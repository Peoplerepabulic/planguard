[project]
name = "planguard"
version = "0.1.0"
description = "Pre-execution safety runtime that catches LLM robot-planner failures before they reach the physical world."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
    "fastapi>=0.110",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
thor = ["ai2thor>=5.0", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["planguard*"]
